name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    # 真库集成测试用；没有它们 tests/test_sql_integration.py 会整体 skip
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: netspy
          POSTGRES_DB: netspy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: netspy
          MYSQL_DATABASE: netspy
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -uroot -pnetspy --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: install chromium
        run: python -m playwright install --with-deps chromium
      # patchright 是独立打包的 Playwright fork，钉的 chromium revision
      # 跟 vanilla playwright 不是同一个（实测撞到过：1234 vs 1243）——
      # 上面那条 playwright install 装的版本满足不了它，engine="patchright"
      # 的用例会在全新环境里报「找不到浏览器可执行文件」。dev extra 里带了
      # render-patchright，这一步补齐它自己需要的那份
      - name: install patchright chromium
        run: python -m patchright install --with-deps chromium
      - name: pytest
        # network 标记的用例要打外部指纹服务，放 CI 里会 flaky，本地手动跑
        env:
          NETSPY_TEST_POSTGRES_URL: postgresql://postgres:netspy@127.0.0.1:5432/netspy
          NETSPY_TEST_MYSQL_URL: mysql://root:netspy@127.0.0.1:3306/netspy
          NETSPY_TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: pytest -ra -m "not network" --cov --cov-report=term-missing

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[docs]"
      - run: mkdocs build --strict

  # 打包坏了要在 PR 就红，而不是发布当天才发现
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - name: build sdist + wheel
        run: python -m build
      - name: twine check
        run: twine check --strict dist/*

      - name: 干净环境装 wheel 冒烟
        run: |
          wheel=$(ls dist/*.whl)
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install "$wheel"
          /tmp/smoke/bin/python -c "import netspy; print(netspy.__version__)"
          # 只装核心包时 CLI 要给提示而不是 ModuleNotFoundError 堆栈
          /tmp/smoke/bin/netspy --version 2>&1 | grep -q 'netspy\[cli\]'
          /tmp/smoke/bin/pip install "${wheel}[cli]"
          /tmp/smoke/bin/netspy --version
