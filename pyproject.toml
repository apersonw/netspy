[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netspy"
dynamic = ["version"]
description = "一个上手简单、结构清晰的 Python 爬虫框架"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lucas", email = "schummshelly26@gmail.com" }]
keywords = ["crawler", "spider", "scraping", "爬虫"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "parsel>=1.9",
    "w3lib>=2.1",
    "loguru>=0.7",
    "bitarray>=2.9",
]

[project.urls]
Homepage = "https://github.com/apersonw/netspy"
Repository = "https://github.com/apersonw/netspy"
Documentation = "https://apersonw.github.io/netspy/"
Changelog = "https://github.com/apersonw/netspy/blob/main/CHANGELOG.md"
Issues = "https://github.com/apersonw/netspy/issues"

[project.optional-dependencies]
render = ["playwright>=1.44", "playwright-stealth>=2.0"]
# CDP 层补丁（Runtime.enable / Console.enable 探测点），只支持 chromium。
# 独立 extra，不进 render/all——是否要多装这一个包由用户自己决定
render-patchright = ["patchright>=1.40"]
mongo = ["pymongo>=4.7"]
mysql = ["pymysql>=1.1", "dbutils>=3.0"]
redis = ["redis>=5.0"]
cli = ["typer>=0.12", "jinja2>=3.1"]
metrics = ["prometheus-client>=0.20"]
curl = ["curl_cffi>=0.16"]  # TLS / HTTP2 指纹伪装
postgres = ["psycopg[binary,pool]>=3.1"]  # 注意 psycopg 是 LGPL-3.0
elasticsearch = ["elasticsearch>=8.0"]
kafka = ["kafka-python>=2.0"]
all = ["netspy[render,mongo,mysql,postgres,elasticsearch,kafka,redis,cli,metrics,curl]"]
dev = [
    "netspy[all]",
    # engine="patchright" 不进 all（用户端要不要多装这个由自己决定），
    # 但项目自己的测试要覆盖到这条路径，否则悄悄坏掉也没人发现
    "netspy[render-patchright]",
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "pytest-httpserver>=1.0",
    "mongomock>=4.1",
    # [lua] 拉 lupa：Redis 布隆的置位+计数用 Lua 保证原子，没有它 fakeredis
    # 会直接 unknown command 'evalsha'，这条路径就悄悄没被测到
    "fakeredis[lua]>=2.20",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

[project.scripts]
# 指向 commands/__init__ 的轻量守卫：没装 [cli] extra 时给提示而不是 ModuleNotFoundError
netspy = "netspy.commands:main"

[tool.hatch.version]
path = "netspy/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["netspy"]

[tool.hatch.build.targets.sdist]
include = [
    "/netspy",
    "/tests",
    "/docs",
    "/examples",
    "/mkdocs.yml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

# ----------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["netspy", "tests"]
extend-exclude = ["docs", "site"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RUF"]
# RUF001-003: 中文全角标点被判定为「易混淆字符」，本项目注释大量使用中文，需忽略
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# 测试里频繁定义局部爬虫子类，__custom_setting__ 用普通 dict 更自然
"tests/*" = ["RUF012"]
# 示例要展示框架实际教用户写的形式（脚手架模板里的 __unique_key__ 就是普通 list），
# 为了过 lint 改成 ClassVar 反而不像真实用法
"examples/*" = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["netspy"]

# ----------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = true
files = ["netspy"]
pretty = true

[[tool.mypy.overrides]]
module = [
    "parsel.*",
    "bitarray.*",
    "w3lib.*",
    "bs4.*",
    "IPython.*",
    "pymysql.*",
    "dbutils.*",
    "curl_cffi.*",
    "psycopg.*",
    "psycopg_pool.*",
    "elasticsearch.*",
    "kafka.*",
    "playwright_stealth.*",
]
ignore_missing_imports = true

# ----------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "render: 需要 Playwright + chromium（playwright install chromium）",
    "network: 需要访问外部网络（指纹验证等），CI 里用 -m 'not network' 排除",
    "integration: 需要真实数据库（见 NETSPY_TEST_*_URL 环境变量），没配就自动 skip",
]

[tool.coverage.run]
source = ["netspy"]
branch = true
